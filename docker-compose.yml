services:
  expense_db:
    image: postgres:16
    container_name: expense_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${EXPENSE_DB_NAME:-expense_db}
    ports:
      - "${EXPENSE_DB_PORT:-5433}:5432"
    volumes:
      - expense_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${EXPENSE_DB_NAME:-expense_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  users_db:
    image: postgres:16
    container_name: users_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${USERS_DB_NAME:-users_db}
    ports:
      - "${USERS_DB_PORT:-5434}:5432"
    volumes:
      - users_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${USERS_DB_NAME:-users_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  expense_service:
    build:
      context: .
      dockerfile: backend/expense_service/Dockerfile
    container_name: expense_service
    ports:
      - "8001:8001"
    environment:
      # Built from the same variables as the database service, so the
      # credentials live in exactly one place (.env, which is not committed).
      EXPENSE_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@expense_db:5432/${EXPENSE_DB_NAME:-expense_db}
      # Must match the auth service: the expense service verifies its JWTs.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
      ALGORITHM: ${ALGORITHM:-HS256}
    depends_on:
      expense_db:
        condition: service_healthy

  auth_service:
    build:
      context: .
      dockerfile: backend/auth_service/Dockerfile
    container_name: auth_service
    ports:
      - "8000:8000"
    environment:
      USER_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@users_db:5432/${USERS_DB_NAME:-users_db}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    depends_on:
      users_db:
        condition: service_healthy

volumes:
  expense_db_data:
  users_db_data:
