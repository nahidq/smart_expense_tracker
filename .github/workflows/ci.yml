name: CI
on:
  push:
   branches:
     - main
  pull_request:
     branches:
       - main
jobs:
  backend-tests:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            test_path: tests
            working_directory: backend/auth_service
          - service: expense-service
            working_directory: backend/expense_service
            test_path: tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - "8911:5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
         python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-root --no-interaction --no-ansi
      - name: Run service tests
        working-directory: ${{ matrix.working_directory }}
        env:
          PYTHONPATH: .
          USER_DATABASE_URL: postgresql+psycopg2://postgres:test_password@localhost:8911/test_db
          TEST_DATABASE_URL: postgresql://postgres:test_password@localhost:8911/test_db
          EXPENSE_DATABASE_URL: postgresql+psycopg2://postgres:test_password@localhost:8911/test_db
          SECRET_KEY: test-secret-key
        run: |
          poetry run pytest ${{ matrix.test_path }}

  migration-check:
    name: Migrations in sync (expense-service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - "8911:5432"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-root --no-interaction --no-ansi
      - name: Apply migrations then verify models match
        working-directory: backend/expense_service
        env:
          PYTHONPATH: .
          EXPENSE_DATABASE_URL: postgresql+psycopg2://postgres:test_password@localhost:8911/test_db
          SECRET_KEY: test-secret-key
        run: |
          poetry run alembic upgrade head   # build schema from migrations on an empty DB
          poetry run alembic check          # fail if models have changes not captured in a migration

  frontend-checks:
    runs-on: ubuntu-latest
    container:
      image: node:20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
    
