name: CI
on:
  push:
   branches:
     - main
  pull_request:
     branches:
       - main
jobs:
  backend-tests:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: auth-service
            test_path: tests
            working_directory: backend/auth_service
          - service: expense-service
            working_directory: backend/expense_service
            test_path: tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 8911
          POSTGRES_DB: expense_test_db
        ports:
          - "8911:5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
         python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-root --no-interaction --no-ansi
      - name: Run service tests
        working-directory: ${{ matrix.working_directory }}
        run: |
          poetry run pytest ${{ matrix.test_path }}
  frontend-checks:
    runs-on: ubuntu-latest
    container:
      image: node:20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
    
