# Template. Copy to 01-secret.yaml and fill in real values:
#     cp k8s/01-secret.example.yaml k8s/01-secret.yaml
#
# k8s/01-secret.yaml is git-ignored so real values are never committed.
# Note that a Kubernetes Secret is only base64-encoded, not encrypted. For a
# real deployment use a sealed/external secrets operator or your cloud
# provider's secret manager instead of a committed manifest.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: expense-tracker
type: Opaque
# stringData lets us write plain text; Kubernetes base64-encodes it for us.
stringData:
  # Both services read the same SECRET_KEY so their JWTs stay compatible.
  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  SECRET_KEY: change-me
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: change-me
