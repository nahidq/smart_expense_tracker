# Two PostgreSQL databases, one per service.
# NOTE: emptyDir storage is EPHEMERAL — data is lost if the Pod restarts.
# For production use a StatefulSet + PersistentVolumeClaim, or a managed DB.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-db
  namespace: expense-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expense-db
  template:
    metadata:
      labels:
        app: expense-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: "8911"
            - name: POSTGRES_DB
              value: expense_db
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: expense-db
  namespace: expense-tracker
spec:
  selector:
    app: expense-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-db
  namespace: expense-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-db
  template:
    metadata:
      labels:
        app: users-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: "8911"
            - name: POSTGRES_DB
              value: users_db
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: users-db
  namespace: expense-tracker
spec:
  selector:
    app: users-db
  ports:
    - port: 5432
      targetPort: 5432
